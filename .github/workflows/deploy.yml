# Production. moox.io is served by GitHub Pages from this workflow, and only
# from this workflow.
#
# Pull request previews are NOT here: they are built by Cloudflare Pages, wired
# through its GitHub app rather than a workflow, so nothing about production
# depends on them. Settings, for the record - build `npm run build`, output
# `dist/client`, production branch `main`, no custom domain (moox.io DNS must
# keep pointing at GitHub Pages). Cloudflare comments the preview URL on each PR
# and serves preview deployments with `X-Robots-Tag: noindex`.
#
# Previews live at a *domain root*, which is the whole point: every asset and
# link this site emits is root-absolute (`/assets/…`, `/resume`), so the build
# runs unmodified at any root but would break under a sub-path. Serving previews
# from a sub-path instead would mean `base` + router `basepath` + a prefix on
# the ~60 hand-written paths in `src/` and in the content JSON - and `<base
# href>` does not help, it only rewrites *relative* URLs, never `/…` ones.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
